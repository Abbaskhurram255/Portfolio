<html lang="en">
  <head>
    <meta charset="UTF-8" />

	rel="icon"
	type="image/png"
	href="./loxx2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khurram Ali's Portfolio</title>
    <script type="module" crossorigin src="./assets/index-BUEqChwp.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-UqCbn-fy.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
        const w = window;
        const [
            MIN_ALLOWED_VOLUME,
            MAX_ALLOWED_VOLUME
        ] = [
            0.1,
            0.5
        ];
        const audio = new Audio("./music.mp3");
        audio.loop = true;
        audio.autoplay = true;
        audio.muted = true;
        audio.play().then(() => {
            console.log("Muted autoplay started.");
        });
        const enableAudioOnFirstInteraction = () => {
            audio.muted = false;
            audio.volume = 0.3;
            audio.play();
            console.log("Audio unmuted via user interaction.");
            interactionEvents.forEach(event => {
            window.removeEventListener(
	event,
	enableAudioOnFirstInteraction
            );
        });
    };
    const interactionEvents = [
	'click', 
	'drag',
	'keyup',
	'keydown',
	'keypress',
	'touchstart'
    ];
    interactionEvents.forEach(event => {
        window.addEventListener(
	event,
	enableAudioOnFirstInteraction
        );
    });
    window.addEventListener('keydown', (e) => {
        let key = e.key.toLowerCase();
        if (key === 'm') {
            audio.muted = !audio.muted;
            console.log(`Audio muted state: ${audio.muted}`);
        } else if (key == 'arrowup') {
            if (audio.volume + .1 <= MAX_ALLOWED_VOLUME) audio.volume += .1;
        } else if (key == 'arrowdown') {
            if (audio.volume - .1 >= MIN_ALLOWED_VOLUME) audio.volume -= .1;
        }
    });
    </script>
  </body>
</html>
